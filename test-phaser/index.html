<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoQuest — test d'animation : l'attaque</title>
  <style>
    html, body { height: 100%; margin: 0; background: #05080d; color: #93a8b6;
      font-family: Georgia, "Palatino Linotype", serif; }
    .shell { height: 100dvh; display: grid; grid-template-rows: 1fr auto; justify-items: center; padding: 10px 10px 8px; gap: 6px; }
    #game { width: 100%; height: 100%; min-height: 0; }
    #game canvas { border-radius: 6px; box-shadow: 0 0 0 1px rgba(160,190,210,.18), 0 18px 60px rgba(0,0,0,.55); }
    p { margin: 0; font-size: 14px; text-align: center; }
  </style>
</head>
<body>
  <main class="shell">
    <div id="game"></div>
    <p>Clique (ou Espace) : 1er coup + riposte du Kraken. Clique encore : coup final. Encore un clic : on rejoue</p>
  </main>
  <!-- 1. La bibliothèque de jeu (le moteur) -->
  <script src="phaser.min.js"></script>
  <!-- 2. Notre jeu : les réglages et l'animation -->
  <script src="main.js"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoQuest — version 1</title>
  <!-- La police pixel des dialogues (comme dans ton Figma) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; background: #05080d; color: #93a8b6;
      font-family: Georgia, "Palatino Linotype", serif; }
    .shell { height: 100dvh; display: grid; grid-template-rows: 1fr auto; justify-items: center; padding: 10px 10px 8px; gap: 6px; }
    #game { width: 100%; height: 100%; min-height: 0; }
    #game canvas { border-radius: 6px; box-shadow: 0 0 0 1px rgba(160,190,210,.18), 0 18px 60px rgba(0,0,0,.55); }
    /* Le curseur de la souris : la flèche dorée de ton Figma (pointe en haut à gauche = point actif « 3 1 ») */
    html, body, #game canvas { cursor: url('assets/curseur.png') 3 1, auto !important; }
    p { margin: 0; font-size: 13px; text-align: center; opacity: .8; }
  </style>
</head>
<body>
  <main class="shell">
    <div id="game"></div>
    <p>Clique (ou Espace) pour avancer dans les dialogues</p>
  </main>
  <!-- 1. La bibliothèque de jeu (le moteur) -->
  <script src="phaser.min.js"></script>
  <!-- 2. Notre jeu -->
  <script src="main.js"></script>
</body>
</html>
